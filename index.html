<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Display</title>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <!-- ★修正1: locale/ja は読み込むが、日付フォーマットには使わない -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/ja.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
    body {
        background-color: #000;
        background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url("background.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        /* ★修正: fixed は古いiOSで不具合が出るため scroll に変更 */
        background-attachment: scroll;

        margin: 0;
        padding: 15px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center; /* これを追加：中身を上下の中央に寄せます */
        min-height: 100vh;      /* これを追加：画面の高さ一杯を基準にします */
        gap: 20px;
        color: #fff;
        font-family: 'Orbitron', sans-serif;
        position: relative;
    }

        #clock {
            font-size: 75px;
            font-weight: 200;
            margin-top: 5px;
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        #date {
            font-size: 22px;
            color: #ccc;
            margin-top: 5px;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        #weather-container {
            width: 90%;
            max-width: 450px;
            height: 60px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 0;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
        }

        #weather-text {
            font-size: 20px;
            color: #ddd;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #weather-text i {
            font-size: 28px;
            color: #fff;
        }

        #calendar-container {
            width: 90%;
            max-width: 450px;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 12px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .weekday {
            font-size: 13px;
            color: #aaa;
            font-weight: bold;
            padding-bottom: 5px;
        }

        .weekday:nth-child(1), .holiday, .sunday { color: #ff6b6b; }
        .weekday:nth-child(7), .saturday { color: #4dadff; }

        .day {
            font-size: 19px;
            color: #fff;
            padding: 8px 0;
            border-radius: 4px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.9);
        }

        .today {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-weight: bold;
        }

        .off {
            color: rgba(255, 255, 255, 0.15) !important;
            text-shadow: none;
        }
    /* 画面の横幅が縦幅より大きい（横向き）時の設定 */
@media (orientation: landscape) {
    body {
        flex-direction: row; /* 縦並びから横並びに変更 */
        justify-content: space-around;
        align-items: center;
        padding: 20px;
    }

    /* 左側：カレンダー容器 */
    #calendar-container {
        flex: 1;
        margin: 0;
        display: flex;
        justify-content: center;
    }

    /* 右側：情報をまとめるための仮のグループ（後述のHTML修正が必要） */
    .info-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* 横向きの時は時計を少し小さくしてバランスを取る */
    #clock {
        font-size: 100px; 
        margin-bottom: 10px;
    }
}
    </style>
</head>
<body>
    <!-- 左側にくる要素 -->
    <div id="calendar-container">
        <div class="calendar-grid" id="calendar"></div>
    </div>

    <!-- 右側にくる要素をグループ化 -->
    <div class="info-group">
        <div id="date">YYYY.M.D DAY</div>
        <div id="clock">00:00</div>
        <div id="weather-container">
            <div id="weather-text">WEATHER LOADING...</div>
        </div>
    </div>

    <script>
        // ★修正1: locale('ja')を設定しない → ddd が英語（MON, TUE…）になる
        // ※カレンダービルドには不要、日付フォーマットは英語で統一

        // ★修正2: 複数年の祝日データ（2025〜2027）に対応
        const holidays = new Set([
            // 2025年
            "2025-01-01", "2025-01-13", "2025-02-11", "2025-02-23", "2025-02-24",
            "2025-03-20", "2025-04-29", "2025-05-03", "2025-05-04", "2025-05-05",
            "2025-05-06", "2025-07-21", "2025-08-11", "2025-09-15", "2025-09-23",
            "2025-10-13", "2025-11-03", "2025-11-23", "2025-11-24",
            // 2026年
            "2026-01-01", "2026-01-12", "2026-02-11", "2026-02-23",
            "2026-03-20", "2026-04-29", "2026-05-03", "2026-05-04",
            "2026-05-05", "2026-05-06", "2026-07-20", "2026-08-11",
            "2026-09-21", "2026-09-22", "2026-09-23", "2026-10-12",
            "2026-11-03", "2026-11-23",
            // 2027年
            "2027-01-01", "2027-01-11", "2027-02-11", "2027-02-23",
            "2027-03-21", "2027-03-22", "2027-04-29", "2027-05-03",
            "2027-05-04", "2027-05-05", "2027-07-19", "2027-08-11",
            "2027-09-20", "2027-09-23", "2027-10-11", "2027-11-03",
            "2027-11-23"
        ]);

        // ★修正3: 曜日の英語略称（locale依存しない）
        const WEEKDAY_SHORT = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

        // ★修正4: 日付変化を検知してカレンダーを自動更新
        let lastRenderedDate = '';

        function updateClock() {
            const now = dayjs();
            document.getElementById('clock').textContent = now.format('HH:mm');

            // 曜日は自前の配列から取得（locale不問で英語になる）
            const weekday = WEEKDAY_SHORT[now.day()];
            document.getElementById('date').textContent =
                `${now.format('YYYY.M.D')} ${weekday}`;

            // 日付が変わったらカレンダーを再描画
            const todayStr = now.format('YYYY-MM-DD');
            if (todayStr !== lastRenderedDate) {
                lastRenderedDate = todayStr;
                buildCalendar();
            }
        }

        async function updateWeather() {
            try {
                const response = await fetch(
                    'https://api.open-meteo.com/v1/forecast?latitude=35.28&longitude=139.67&current_weather=true&timezone=Asia%2FTokyo'
                );
                const data = await response.json();
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;

                let icon = "fa-sun";
                if (code >= 1  && code <= 3)  icon = "fa-cloud-sun";
                if (code >= 45 && code <= 48) icon = "fa-smog";
                if (code >= 51 && code <= 67) icon = "fa-cloud-showers-heavy";
                if (code >= 71 && code <= 77) icon = "fa-snowflake";
                if (code >= 80 && code <= 82) icon = "fa-cloud-rain";
                if (code >= 95 && code <= 99) icon = "fa-bolt";

                document.getElementById('weather-text').innerHTML =
                    `YOKOSUKA : <i class="fas ${icon}"></i>  ${temp}°C`;
            } catch (error) {
                document.getElementById('weather-text').textContent = "YOKOSUKA : 天気読み込みエラー";
            }
        }

        function buildCalendar() {
            const now = dayjs();
            const startOfMonth = now.startOf('month');
            const endOfMonth = now.endOf('month');

            let startDay = startOfMonth.startOf('week'); // 日曜始まり
            const endDay = endOfMonth.endOf('week');

            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';

            // 曜日ヘッダー
            WEEKDAY_SHORT.forEach(day => {
                const dayEl = document.createElement('div');
                dayEl.classList.add('weekday');
                dayEl.textContent = day;
                calendarEl.appendChild(dayEl);
            });

            // 日付セル
            let date = startDay;
            while (date.isBefore(endDay) || date.isSame(endDay, 'day')) {
                const dayEl = document.createElement('div');
                dayEl.classList.add('day');
                dayEl.textContent = date.date();

                const dateStr = date.format('YYYY-MM-DD');

                if (date.month() !== now.month()) {
                    dayEl.classList.add('off');
                } else {
                    if (date.day() === 0)      dayEl.classList.add('sunday');
                    else if (date.day() === 6) dayEl.classList.add('saturday');

                    if (holidays.has(dateStr)) dayEl.classList.add('holiday');
                    if (date.isSame(now, 'day')) dayEl.classList.add('today');
                }

                calendarEl.appendChild(dayEl);
                date = date.add(1, 'day');
            }
        }

        // 時計は1秒ごと（日付変化の検知も兼ねる）
        setInterval(updateClock, 1000);
        // 天気は30分ごと
        setInterval(updateWeather, 1800000);

        // 初期描画
        updateClock(); // buildCalendar() も内部で呼ばれる
        updateWeather();
    </script>
</body>
</html>
