<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Display</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #clock {
            font-size: 80px;
            font-weight: 200;
            margin-top: 30px;
            letter-spacing: 2px;
        }

        #date {
            font-size: 24px;
            color: #888;
            margin-bottom: 30px;
        }

        .widget {
            width: 90%;
            max-width: 600px;
            border-top: 1px solid #333;
            padding-top: 20px;
            margin-top: 10px;
            text-align: center;
        }

        /* iPad mini 3（古いiOS）でも崩れにくく、かつダークモード風にする設定 */
        iframe {
            border: none;
            filter: invert(90%) hue-rotate(180deg);
            border-radius: 8px;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <div id="clock">00:00</div>
    <div id="date">YYYY/MM/DD</div>

    <div class="widget">
        <iframe src="https://calendar.google.com/calendar/embed?height=400&wkst=1&ctz=Asia%2FTokyo&bgcolor=%23ffffff&src=ja.japanese%23holiday%40group.v.calendar.google.com&color=%230B8043&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0" style="border-width:0" width="100%" height="400" frameborder="0" scrolling="no"></iframe>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const y = now.getFullYear();
            const mon = now.getMonth() + 1;
            const d = now.getDate();
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            
            document.getElementById('clock').textContent = `${h}:${m}`;
            document.getElementById('date').textContent = `${y}.${mon}.${d} ${days[now.getDay()]}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
