<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Display</title>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/ja.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
    body {
        /* 1. 背景色を保険で黒に */
        background-color: #000;
        
        /* 2. 背景画像をbodyに直接指定（古いブラウザでも確実に動くurl指定） */
        background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url("background.jpg");
        
        /* 3. 背景の出方を固定 */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed; /* これが古いiOSで悪さをする場合は後で消します */

        margin: 0;
        padding: 15px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #fff;
        font-family: 'Orbitron', sans-serif;
        position: relative;
    }

        /* カレンダーエリア */
        #calendar-container {
            width: 90%;
            max-width: 450px;
            padding-top: 5px;
            background-color: rgba(0, 0, 0, 0.4); /* カレンダーの視認性を上げる背景 */
            padding: 15px;
            border-radius: 12px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .weekday {
            font-size: 13px;
            color: #aaa;
            font-weight: bold;
            padding-bottom: 5px;
        }

        /* 日曜・祝日の色（背景画像に映えるよう少し明るめに調整） */
        .weekday:nth-child(1), .holiday, .sunday { color: #ff6b6b; } 
        /* 土曜の色（鮮やかな青） */
        .weekday:nth-child(7), .saturday { color: #4dadff; } 

        .day {
            font-size: 19px;
            color: #fff;
            padding: 8px 0;
            border-radius: 4px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.9);
        }

        /* 今日 */
        .today {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-weight: bold;
        }

        /* 当月以外の日付をさらに薄く */
        .off {
            color: rgba(255, 255, 255, 0.15) !important;
            text-shadow: none;
        }
        #date {
            font-size: 22px;
            color: #ccc;
            margin-top: 5px;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }
        
        #clock {
            font-size: 90px;
            font-weight: 200;
            margin-top: 5px;
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); /* 文字の視認性を上げる影 */
        }

        

        /* 天気エリア */
        #weather-container {
            width: 90%;
            max-width: 450px;
            height: 60px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 0;
            background-color: rgba(0, 0, 0, 0.3); /* 天気部分の背景を少し暗く */
            border-radius: 6px;
        }

        #weather-text {
            font-size: 20px;
            color: #ddd;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #weather-text i {
            font-size: 28px;
            color: #fff;
        }

        
    </style>
</head>
<body>

    <div id="clock">00:00</div>
    <div id="date">YYYY/MM/DD</div>

    <div id="weather-container">
        <div id="weather-text">WEATHER LOADING...</div>
    </div>

    <div id="calendar-container">
        <div class="calendar-grid" id="calendar"></div>
    </div>

    <script>
        dayjs.locale('ja');

        const holidays2026 = [
            "2026-01-01", "2026-01-12", "2026-02-11", "2026-02-23",
            "2026-03-20", "2026-04-29", "2026-05-03", "2026-05-04",
            "2026-05-05", "2026-05-06", "2026-07-20", "2026-08-11",
            "2026-09-21", "2026-09-22", "2026-09-23", "2026-10-12",
            "2026-11-03", "2026-11-23"
        ];

        function updateClock() {
            const now = dayjs();
            document.getElementById('clock').textContent = now.format('HH:mm');
            document.getElementById('date').textContent = now.format('YYYY.M.D ddd').toUpperCase();
        }

        async function updateWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.28&longitude=139.67&current_weather=true&timezone=Asia%2FTokyo');
                const data = await response.json();
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;

                let icon = "fa-sun";
                if (code >= 1 && code <= 3) icon = "fa-cloud-sun";
                if (code >= 45 && code <= 48) icon = "fa-smog";
                if (code >= 51 && code <= 67) icon = "fa-cloud-showers-heavy";
                if (code >= 71 && code <= 77) icon = "fa-snowflake";
                if (code >= 80 && code <= 82) icon = "fa-cloud-rain";
                if (code >= 95 && code <= 99) icon = "fa-bolt";

                document.getElementById('weather-text').innerHTML = `YOKOSUKA : <i class="fas ${icon}"></i>  ${temp}°C`;
            } catch (error) {
                document.getElementById('weather-text').textContent = "YOKOSUKA : 天気読み込みエラー";
            }
        }

        function buildCalendar() {
            const now = dayjs();
            const startOfMonth = now.startOf('month');
            const endOfMonth = now.endOf('month');
            
            let startDay = startOfMonth.startOf('week');
            const endDay = endOfMonth.endOf('week');

            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';

            const weekdays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            weekdays.forEach(day => {
                const dayEl = document.createElement('div');
                dayEl.classList.add('weekday');
                dayEl.textContent = day;
                calendarEl.appendChild(dayEl);
            });

            let date = startDay;
            while (date.isBefore(endDay) || date.isSame(endDay, 'day')) {
                const dayEl = document.createElement('div');
                dayEl.classList.add('day');
                dayEl.textContent = date.date();

                const dateStr = date.format('YYYY-MM-DD');

                if (date.month() !== now.month()) {
                    dayEl.classList.add('off');
                } else {
                    if (date.day() === 0) {
                        dayEl.classList.add('sunday');
                    } else if (date.day() === 6) {
                        dayEl.classList.add('saturday');
                    }
                    
                    if (holidays2026.includes(dateStr)) {
                        dayEl.classList.add('holiday');
                    }

                    if (date.isSame(now, 'day')) {
                        dayEl.classList.add('today');
                    }
                }

                calendarEl.appendChild(dayEl);
                date = date.add(1, 'day');
            }
        }

        setInterval(updateClock, 1000);
        setInterval(updateWeather, 1800000);

        updateClock();
        buildCalendar();
        updateWeather();
    </script>
</body>
</html>
