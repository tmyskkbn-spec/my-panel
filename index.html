<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Art Panel Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
    background-color: #f4f1ea; 
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    color: #333;
    overflow: hidden;
}

/* ポスター画像部分 */
.art-container {
    margin-top: 4vh;
    width: 85%;
    flex: 1;
    background-image: url("may2.jpg");
    background-size: cover;
    background-position: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

/* 下部情報エリア */
.footer-section {
    width: 85%;
    padding: 2vh 0 4vh 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end; /* 下揃えをキープ */
}

/* 左：日付・天気・時計の順に整理 */
.footer-left {
    text-align: left;
    display: flex;
    flex-direction: column;
}

#date {
    font-size: 26px; /* 18pxから拡大 */
    letter-spacing: 3px;
    opacity: 0.8;
    margin-bottom: 4px;
    font-weight: 700; /* 少し太めにして視認性UP */
}

#weather-text {
    font-size: 21px; /* 15pxから拡大 */
    letter-spacing: 2px;
    opacity: 0.6;
    margin-bottom: 12px;
    text-transform: uppercase;
}

#clock {
    font-size: 90px; /* 72pxから大幅に拡大 */
    line-height: 0.85;
    letter-spacing: 4px;
    font-weight: 700;
    color: #222;
}

/* 右：カレンダー */
.footer-right {
    text-align: right;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px; /* 隙間を少し広げて見やすく */
    font-size: 18px; /* 11pxから拡大 */
}

.calendar-day {
    width: 36px;  /* 28pxから拡大 */
    height: 36px; /* 28pxから拡大 */
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
}

/* 今日の強調：黒い円形（サイズアップに対応） */
.today {
    font-weight: bold;
    color: #fff !important;
}

.today::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 32px; /* カレンダー拡大に合わせて円も大きく */
    height: 32px;
    background-color: rgba(51, 51, 51, 0.9);
    border-radius: 50%;
    z-index: -1;
}

.sun, .holiday { color: #e74c3c; font-weight: bold; }
.sat { color: #3498db; font-weight: bold; }
    </style>
</head>
<body>

    <div class="art-container"></div>

    <div class="footer-section">
        <div class="footer-left">
            <div id="date">----.--.-- ---</div>
            <div id="weather-text">WEATHER LOADING...</div>
            <div id="clock">00:00</div>
        </div>
        <div class="footer-right">
            <div id="calendar" class="calendar-grid"></div>
        </div>
    </div>

    <script>
        let holidays = {};
        let lastDate = -1;

        function fixVh() { document.body.style.height = window.innerHeight + 'px'; }
        window.addEventListener('orientationchange', () => { setTimeout(fixVh, 300); });
        fixVh();

        async function fetchHolidays() {
            try {
                const response = await fetch('https://holidays-jp.github.io/api/v1/date.json');
                holidays = await response.json();
                buildCalendar();
            } catch (e) { console.error("Holiday fetch error", e); }
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;

            const today = now.getDate();
            if (lastDate !== today) {
                lastDate = today;
                const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
                document.getElementById('date').textContent = `${now.getFullYear()}.${now.getMonth() + 1}.${now.getDate()} ${days[now.getDay()]}`;
                buildCalendar();
            }
        }

        function buildCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const lastDateNum = new Date(year, month + 1, 0).getDate();
            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';

            const weekDays = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            weekDays.forEach((w, i) => {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day' + (i===0 ? ' sun' : (i===6 ? ' sat' : ''));
                dayEl.textContent = w;
                calendarEl.appendChild(dayEl);
            });

            for (let i = 0; i < firstDay; i++) {
                calendarEl.appendChild(document.createElement('div'));
            }

            for (let i = 1; i <= lastDateNum; i++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day';
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const dayOfWeek = (firstDay + i - 1) % 7;

                if (i === now.getDate()) dayEl.classList.add('today');
                if (dayOfWeek === 0) dayEl.classList.add('sun');
                if (dayOfWeek === 6) dayEl.classList.add('sat');
                if (holidays[dateKey]) dayEl.classList.add('holiday');

                dayEl.textContent = i;
                calendarEl.appendChild(dayEl);
            }
        }

        async function updateWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.2811&longitude=139.6722&current_weather=true');
                const data = await res.json();
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;
                const weatherMap = {0:'CLEAR', 1:'FAIR', 2:'CLOUDY', 3:'OVERCAST', 45:'FOG', 61:'RAIN', 71:'SNOW', 95:'STORM'};
                document.getElementById('weather-text').textContent = `${temp}°C / ${weatherMap[code] || 'UNKNOWN'}`;
            } catch (e) { document.getElementById('weather-text').textContent = 'WEATHER ERROR'; }
        }

        setInterval(updateClock, 1000);
        updateClock();
        fetchHolidays();
        updateWeather();
        setInterval(updateWeather, 3600000);
        function applyNightMode() {
    const hour = new Date().getHours();
    const isNight = (hour >= 21 || hour < 6); // 21時〜翌6時を夜間とする
    
    if (isNight) {
        // 夜間：ダークモード（焼き付き防止）
        document.body.style.backgroundColor = "#1a1a1a"; // 暗いグレー
        document.body.style.color = "#888"; // 文字も暗めに
        document.querySelector('.art-container').style.filter = "brightness(0.4) grayscale(0.5)";
        document.getElementById('clock').style.color = "#aaa";
        // 今日の円の色も調整
        const todayEl = document.querySelector('.today::before');
        if(todayEl) todayEl.style.backgroundColor = "rgba(170, 170, 170, 0.5)";
    } else {
        // 昼間：通常モード
        document.body.style.backgroundColor = "#f4f1ea";
        document.body.style.color = "#333";
        document.querySelector('.art-container').style.filter = "brightness(1.0) grayscale(0)";
        document.getElementById('clock').style.color = "#222";
    }
}

// 1分ごとにチェック
setInterval(applyNightMode, 60000);
applyNightMode(); // 起動時にも実行
    </script>
</body>
</html>
