<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Display</title>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/ja.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #clock {
            font-size: 80px;
            font-weight: 200;
            margin-top: 20px;
            letter-spacing: 2px;
        }

        #date {
            font-size: 24px;
            color: #888;
            margin-bottom: 25px;
        }

        /* 自作カレンダーのスタイル */
        #calendar-container {
            width: 90%;
            max-width: 500px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            text-align: center;
        }

        .weekday {
            font-size: 14px;
            color: #666;
            font-weight: bold;
            padding-bottom: 10px;
        }

        .day {
            font-size: 20px;
            color: #fff;
            padding: 10px 0;
            border-radius: 4px;
        }

        /* 今日の日付を強調するデザイン（グレーの枠線でシンプルに） */
        .today {
            background-color: #222;
            border: 1px solid #555;
            font-weight: bold;
        }

        /* 先月・来月の日付は暗くする */
        .off {
            color: #333;
        }
    </style>
</head>
<body>

    <div id="clock">00:00</div>
    <div id="date">YYYY/MM/DD</div>

    <div id="calendar-container">
        <div class="calendar-grid" id="calendar">
            </div>
    </div>

    <script>
        // Day.jsの設定
        dayjs.locale('ja');

        function updateClock() {
            const now = dayjs();
            document.getElementById('clock').textContent = now.format('HH:mm');
            document.getElementById('date').textContent = now.format('YYYY.M.D ddd').toUpperCase();
        }

        function buildCalendar() {
            const now = dayjs();
            const startOfMonth = now.startOf('month');
            const endOfMonth = now.endOf('month');
            
            // カレンダーの表示開始日（月曜始まりにするか日曜始まりにするか。ここでは日曜始まり）
            let startDay = startOfMonth.startOf('week');
            const endDay = endOfMonth.endOf('week');

            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';

            // 曜日のヘッダーを追加
            const weekdays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            weekdays.forEach(day => {
                const dayEl = document.createElement('div');
                dayEl.classList.add('weekday');
                dayEl.textContent = day;
                calendarEl.appendChild(dayEl);
            });

            // 日付のマス目を追加
            let date = startDay;
            while (date.isBefore(endDay) || date.isSame(endDay, 'day')) {
                const dayEl = document.createElement('div');
                dayEl.classList.add('day');
                dayEl.textContent = date.date();

                // 当月以外の日付
                if (date.month() !== now.month()) {
                    dayEl.classList.add('off');
                }
                // 今日
                if (date.isSame(now, 'day')) {
                    dayEl.classList.add('today');
                }

                calendarEl.appendChild(dayEl);
                date = date.add(1, 'day');
            }
        }

        // 初回実行と定期更新
        setInterval(updateClock, 1000);
        updateClock();
        buildCalendar();
    </script>
</body>
</html>
