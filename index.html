<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Display</title>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/ja.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #clock {
            font-size: 75px;
            font-weight: 200;
            margin-top: 5px;
            letter-spacing: 2px;
            line-height: 1;
        }

        #date {
            font-size: 22px;
            color: #888;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        /* 天気エリア（100%自作デザイン） */
        #weather-container {
            width: 90%;
            max-width: 450px;
            height: 60px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            padding: 5px 0;
        }

        #weather-text {
            font-size: 20px;
            color: #ccc;
            letter-spacing: 1px;
            display: flex; /* アイコンと文字を中央に並べる */
            align-items: center;
            gap: 15px; /* アイコンと文字の間隔 */
        }

        /* 天気アイコン自体の大きさ */
        #weather-text i {
            font-size: 28px;
            color: #fff; /* アイコンは白にする */
        }
        
        /* カレンダーエリア */
        #calendar-container {
            width: 90%;
            max-width: 450px;
            padding-top: 5px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .weekday {
            font-size: 13px;
            color: #666;
            font-weight: bold;
            padding-bottom: 5px;
        }

        .weekday:nth-child(1) { color: #d9534f; } /* 日曜 */
        .weekday:nth-child(7) { color: #428bca; } /* 土曜 */

        .day {
            font-size: 19px;
            color: #fff;
            padding: 8px 0;
            border-radius: 4px;
        }

        .today {
            background-color: #222;
            border: 1px solid #666;
            font-weight: bold;
        }

        .off {
            color: #252525 !important;
        }

        .holiday, .sunday {
            color: #d9534f;
        }

        .saturday {
            color: #428bca;
        }
    </style>
</head>
<body>

    <div id="clock">00:00</div>
    <div id="date">YYYY/MM/DD</div>

    <div id="weather-container">
        <div id="weather-text">WEATHER LOADING...</div>
    </div>

    <div id="calendar-container">
        <div class="calendar-grid" id="calendar"></div>
    </div>

    <script>
        dayjs.locale('ja');

        const holidays2026 = [
            "2026-01-01", "2026-01-12", "2026-02-11", "2026-02-23",
            "2026-03-20", "2026-04-29", "2026-05-03", "2026-05-04",
            "2026-05-05", "2026-05-06", "2026-07-20", "2026-08-11",
            "2026-09-21", "2026-09-22", "2026-09-23", "2026-10-12",
            "2026-11-03", "2026-11-23"
        ];

        function updateClock() {
            const now = dayjs();
            document.getElementById('clock').textContent = now.format('HH:mm');
            document.getElementById('date').textContent = now.format('YYYY.M.D ddd').toUpperCase();
        }

        // 横須賀の天気を取得して表示する関数
        async function updateWeather() {
            try {
                // Open-Meteo APIから横須賀（北緯35.28, 東経139.67）の天気を取得
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.28&longitude=139.67&current_weather=true&timezone=Asia%2FTokyo');
                const data = await response.json();
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;

                // 天気コードをFont Awesomeのアイコンに変換
                let icon = "fa-sun"; // デフォルトは晴れ
                if (code >= 1 && code <= 3) icon = "fa-cloud-sun"; // 晴れのち曇り
                if (code >= 45 && code <= 48) icon = "fa-smog"; // 霧
                if (code >= 51 && code <= 67) icon = "fa-cloud-showers-heavy"; // 雨
                if (code >= 71 && code <= 77) icon = "fa-snowflake"; // 雪
                if (code >= 80 && code <= 82) icon = "fa-cloud-rain"; // にわか雨
                if (code >= 95 && code <= 99) icon = "fa-bolt"; // 雷雨
            
                // YOKOSUKAの文字、アイコン、気温を表示
                document.getElementById('weather-text').innerHTML = `YOKOSUKA : <i class="fas ${icon}"></i>  ${temp}°C`;
            } catch (error) {
                document.getElementById('weather-text').textContent = "YOKOSUKA : 天気読み込みエラー";
            }
        }

        function buildCalendar() {
            const now = dayjs();
            const startOfMonth = now.startOf('month');
            const endOfMonth = now.endOf('month');
            
            let startDay = startOfMonth.startOf('week');
            const endDay = endOfMonth.endOf('week');

            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';

            const weekdays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            weekdays.forEach(day => {
                const dayEl = document.createElement('div');
                dayEl.classList.add('weekday');
                dayEl.textContent = day;
                calendarEl.appendChild(dayEl);
            });

            let date = startDay;
            while (date.isBefore(endDay) || date.isSame(endDay, 'day')) {
                const dayEl = document.createElement('div');
                dayEl.classList.add('day');
                dayEl.textContent = date.date();

                const dateStr = date.format('YYYY-MM-DD');

                if (date.month() !== now.month()) {
                    dayEl.classList.add('off');
                } else {
                    if (date.day() === 0) {
                        dayEl.classList.add('sunday');
                    } else if (date.day() === 6) {
                        dayEl.classList.add('saturday');
                    }
                    
                    if (holidays2026.includes(dateStr)) {
                        dayEl.classList.add('holiday');
                    }

                    if (date.isSame(now, 'day')) {
                        dayEl.classList.add('today');
                    }
                }

                calendarEl.appendChild(dayEl);
                date = date.add(1, 'day');
            }
        }

        // 定期実行（1秒ごとに時計、30分ごとに天気を更新）
        setInterval(updateClock, 1000);
        setInterval(updateWeather, 1800000);

        updateClock();
        buildCalendar();
        updateWeather();
    </script>
</body>
</html>
