<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Smart Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
    body {
        background-color: #f4f1ea; /* ポスターのような少し温かみのある白 */
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: 'Orbitron', sans-serif; /* お好みで細めのフォントに変更可 */
        color: #333; /* 文字はポスター風に濃いグレー */
    }

    /* ポスター画像エリア（額縁の中の絵） */
    .art-container {
        margin-top: 40px;
        width: 85%;
        height: 60%; /* 上部に大きく配置 */
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* 情報エリア（ポスターの下部文字部分） */
    .meta-info {
        margin-top: 30px;
        width: 85%;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* 「NATURELLE」の代わりに時計 */
    #clock {
        font-size: 48px;
        letter-spacing: 12px; /* 文字間隔を広げてポスター風に */
        font-weight: 400;
        margin-bottom: 10px;
        color: #222;
    }

    /* 下の小さな文字の並び（日付・天気・カレンダー） */
    .bottom-details {
        display: flex;
        justify-content: space-between;
        width: 100%;
        border-top: 1px solid #ddd;
        padding-top: 15px;
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    /* カレンダーをミニマルに */
    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        font-size: 10px;
    }
    .calendar-day { width: 18px; }
    .today { font-weight: bold; text-decoration: underline; }
</style>

<body>
    <div class="art-container"></div>

    <div class="meta-info">
        <div id="clock">00:00</div>
        
        <div class="bottom-details">
            <div id="date-weather">
                <span id="date">2024.01.01 SUN</span><br>
                <span id="weather-text">--°C CLEAR</span>
            </div>
            
            <div id="calendar-container">
                <div class="calendar-grid" id="calendar"></div>
            </div>
        </div>
    </div>
</body>
</html>
