<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Smart Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
    body {
        background-color: #f4f1ea; /* ポスター下地の生成り色 */
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: 'Orbitron', sans-serif;
        color: #333;
    }

    /* ポスター画像部分 */
    .art-container {
        margin-top: 30px;
        width: 85%;
        flex: 1; /* 画面の大部分を絵に割り当てる */
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    /* 下部情報エリア */
    .footer-section {
        width: 85%;
        padding: 30px 0 40px 0;
        display: flex;
        justify-content: space-between; /* 左右に振り分け */
        align-items: flex-start;
    }

    /* 左：時計・日付・天気 */
    .footer-left {
        text-align: left;
    }

    #clock {
        font-size: 56px;
        line-height: 1;
        letter-spacing: 4px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .meta-data {
        font-size: 14px;
        letter-spacing: 2px;
        opacity: 0.8;
        line-height: 1.6;
    }

    /* 右：カレンダー */
    .footer-right {
        text-align: right;
    }

    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
        font-size: 11px;
    }

    .calendar-day {
        width: 24px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* カレンダーの色設定 */
    .sun, .holiday { color: #e74c3c; font-weight: bold; }
    .sat { color: #3498db; font-weight: bold; }
    .today { border-bottom: 2px solid #333; font-weight: bold; }

</style>

<body>
    <div class="art-container"></div>

    <div class="footer-section">
        <div class="footer-left">
            <div id="clock">00:00</div>
            <div class="meta-data">
                <div id="date">2026.05.08 FRI</div>
                <div id="weather-text">22°C / CLEAR</div>
            </div>
        </div>

        <div class="footer-right">
            <div id="calendar" class="calendar-grid"></div>
        </div>
    </div>
</body>
</html>
