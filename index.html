<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Art Panel Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f4f1ea; /* ポスター下地の生成り色 */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            color: #333;
            overflow: hidden;
            /* iOS 12対策：高さはJSで動的に制御 */
        }

        /* ポスター画像部分 */
        .art-container {
            margin-top: 5vh;
            width: 85%;
            flex: 1;
            background-image: url("may2.jpg");
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        /* 下部情報エリア */
        .footer-section {
            width: 85%;
            padding: 3vh 0 5vh 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* 左：時計・日付・天気 */
        .footer-left { text-align: left; }
        #clock { font-size: 60px; line-height: 1; letter-spacing: 4px; font-weight: 700; margin-bottom: 8px; }
        .meta-data { font-size: 14px; letter-spacing: 2px; opacity: 0.8; line-height: 1.6; }

        /* 右：カレンダー */
        .footer-right { text-align: right; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; font-size: 11px; }
        .calendar-day { width: 24px; height: 20px; display: flex; align-items: center; justify-content: center; }

        /* カレンダーの色設定（復活！） */
        .sun, .holiday { color: #e74c3c; font-weight: bold; }
        .sat { color: #3498db; font-weight: bold; }
        .today { border-bottom: 2px solid #333; font-weight: bold; }
    </style>
</head>
<body>

    <div class="art-container"></div>

    <div class="footer-section">
        <div class="footer-left">
            <div id="clock">00:00</div>
            <div class="meta-data">
                <div id="date">----.--.-- ---</div>
                <div id="weather-text">WEATHER LOADING...</div>
            </div>
        </div>
        <div class="footer-right">
            <div id="calendar" class="calendar-grid"></div>
        </div>
    </div>

    <script>
        let holidays = {};
        let lastDate = -1;

        // iOS 12 高ズレ対策 (Claude案)
        function fixVh() { document.body.style.height = window.innerHeight + 'px'; }
        window.addEventListener('orientationchange', () => { setTimeout(fixVh, 300); });
        fixVh();

        // 祝日データの取得 (復活！)
        async function fetchHolidays() {
            try {
                const response = await fetch('https://holidays-jp.github.io/api/v1/date.json');
                holidays = await response.json();
                buildCalendar();
            } catch (e) { console.error("Holiday fetch error", e); }
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;

            const today = now.getDate();
            if (lastDate !== today) {
                lastDate = today;
                const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
                document.getElementById('date').textContent = `${now.getFullYear()}.${now.getMonth() + 1}.${now.getDate()} ${days[now.getDay()]}`;
                buildCalendar();
            }
        }

        function buildCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const lastDateNum = new Date(year, month + 1, 0).getDate();
            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';

            const weekDays = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            weekDays.forEach((w, i) => {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day' + (i===0 ? ' sun' : (i===6 ? ' sat' : ''));
                dayEl.textContent = w;
                calendarEl.appendChild(dayEl);
            });

            for (let i = 0; i < firstDay; i++) {
                calendarEl.appendChild(document.createElement('div'));
            }

            for (let i = 1; i <= lastDateNum; i++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day';
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const dayOfWeek = (firstDay + i - 1) % 7;

                if (i === now.getDate()) dayEl.classList.add('today');
                if (dayOfWeek === 0) dayEl.classList.add('sun');
                if (dayOfWeek === 6) dayEl.classList.add('sat');
                if (holidays[dateKey]) dayEl.classList.add('holiday');

                dayEl.textContent = i;
                calendarEl.appendChild(dayEl);
            }
        }

        async function updateWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.2811&longitude=139.6722&current_weather=true');
                const data = await res.json();
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;
                const weatherMap = {0:'CLEAR', 1:'FAIR', 2:'CLOUDY', 3:'OVERCAST', 45:'FOG', 61:'RAIN', 71:'SNOW', 95:'STORM'};
                document.getElementById('weather-text').textContent = `${temp}°C / ${weatherMap[code] || 'UNKNOWN'}`;
            } catch (e) { document.getElementById('weather-text').textContent = 'WEATHER ERROR'; }
        }

        // 実行
        setInterval(updateClock, 1000);
        updateClock();
        fetchHolidays();
        updateWeather();
        setInterval(updateWeather, 3600000);
    </script>
</body>
</html>
