<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Smart Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            /* iOS Safariのバグ回避のため fixed は削除 */
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            /* iOS 12対策: 100vhの代わりに固定の高さ指定（フルスクリーン前提） */
            height: 100vh;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            color: #fff;
            /* フォント読み込み失敗時のフォールバックを追加 */
            font-family: 'Orbitron', 'Courier New', monospace;
            overflow: hidden;
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        @media (orientation: landscape) {
            body {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
            }
            .left-group { grid-column: 1; grid-row: 2; align-items: flex-start; justify-content: flex-end; }
            .right-group { grid-column: 2; grid-row: 1; align-items: flex-end; justify-content: flex-start; }
        }

        .left-group { display: flex; flex-direction: column; }
        #clock { font-size: 100px; font-weight: 700; line-height: 1.1; }
        #date { font-size: 26px; margin-top: 5px; }
        #weather-container { font-size: 22px; margin-top: 10px; opacity: 0.9; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 15px;
            /* iPad mini 3でも少し動くようぼかしは控えめ */
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .calendar-day {
            width: 35px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .sun, .holiday { color: #ff6b6b; font-weight: bold; }
        .sat { color: #4dabf7; font-weight: bold; }
        .today { background: rgba(255, 255, 255, 0.3); border-radius: 8px; }
    </style>
</head>
<body>

    <div class="right-group">
        <div id="calendar-container">
            <div class="calendar-grid" id="calendar"></div>
        </div>
    </div>

    <div class="left-group">
        <div id="clock">00:00</div>
        <div id="date">----.--.--</div>
        <div id="weather-container">
            <div id="weather-text">LOADING...</div>
        </div>
    </div>

    <script>
        let holidays = {};
        let lastDate = -1;

        async function fetchHolidays() {
            try {
                const response = await fetch('https://holidays-jp.github.io/api/v1/date.json');
                holidays = await response.json();
                buildCalendar();
            } catch (e) { console.error("Holiday fetch error", e); }
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;

            const today = now.getDate();
            // 日付が変わったらカレンダーを再描画する（Claudeのナイス指摘！）
            if (lastDate !== today) {
                lastDate = today;
                const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
                document.getElementById('date').textContent = `${now.getFullYear()}.${now.getMonth() + 1}.${now.getDate()} ${days[now.getDay()]}`;
                buildCalendar();
            }
        }

        function buildCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const lastDateNum = new Date(year, month + 1, 0).getDate();
            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';

            const weekDays = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            weekDays.forEach((w, i) => {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day' + (i===0 ? ' sun' : (i===6 ? ' sat' : ''));
                dayEl.textContent = w;
                calendarEl.appendChild(dayEl);
            });

            for (let i = 0; i < firstDay; i++) {
                calendarEl.appendChild(document.createElement('div'));
            }

            for (let i = 1; i <= lastDateNum; i++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day';
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const dayOfWeek = (firstDay + i - 1) % 7;

                if (i === now.getDate()) dayEl.classList.add('today');
                if (dayOfWeek === 0) dayEl.classList.add('sun');
                if (dayOfWeek === 6) dayEl.classList.add('sat');
                if (holidays[dateKey]) dayEl.classList.add('holiday');

                dayEl.textContent = i;
                calendarEl.appendChild(dayEl);
            }
        }

        async function updateWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.2811&longitude=139.6722&current_weather=true');
                const data = await res.json();
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;
                // 天気コードをClaudeの指摘通りに完全拡充！
                const weatherMap = {
                    0:'CLEAR', 1:'FAIR', 2:'PARTLY CLOUDY', 3:'OVERCAST', 
                    45:'FOG', 48:'ICY FOG', 51:'DRIZZLE', 61:'RAIN', 
                    63:'RAIN', 65:'HEAVY RAIN', 71:'SNOW', 95:'STORM'
                };
                document.getElementById('weather-text').textContent = `${temp}°C / ${weatherMap[code] || 'UNKNOWN'}`;
            } catch (e) { document.getElementById('weather-text').textContent = 'WEATHER ERROR'; }
        }

        setInterval(updateClock, 1000);
        updateClock();
        fetchHolidays();
        updateWeather();
        setInterval(updateWeather, 3600000);
    </script>
</body>
</html>
